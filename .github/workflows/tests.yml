name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 은 갈래 설정(tomllib)이 도는 최저 판이다. 이 아래는 검사기만 돈다.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 시험용 의존성 설치
        # fontTools 가 있어야 심긴 서체의 라이선스 메타데이터까지 본다.
        run: python -m pip install -r requirements-dev.txt

      - name: 검사기가 의존성 없이 도는지
        # 이 저장소를 받는 사람 대부분은 파일 하나만 쓴다. 그 길이 살아 있는지 먼저 본다.
        run: python assets/doc-style-check.py --list-rules

      - name: 시험
        # 설치된 Claude Code 환경이 없는 기계다. 그 환경을 보는 시험은 건너뛴다.
        run: python -X utf8 -m unittest discover -s tests -v

      - name: 스킬 자체 검사
        run: python -X utf8 skills/finalize-korean-document/scripts/self_test.py

      - name: 공유 자료는 오류 0
        # 사례집은 발행물이다. 규칙을 고치다 이 페이지가 깨지면 여기서 걸린다.
        run: python assets/doc-style-check.py docs/showcase.html --no-rules

      - name: 나가면 안 되는 것
        # 공개 직전에 사람이 한 번 훑었지만 그 뒤 커밋은 아무도 안 봤다. 실제로
        # 실행 기록에 작성자 기계의 홈 경로가 박힌 채 올라갔다(2026-09-08).
        # 사람 이름·고객사 이름은 이 검사가 못 본다 — 그건 리뷰가 본다.
        run: python -X utf8 scripts/check_publish_safety.py
