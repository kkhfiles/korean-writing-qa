# 개인 push 판정 목록 — 이 PC 의 AI 세션이 push 할 때만 2층 판정을 요구한다.
#
# 여럿이 쓰는 저장소는 그 저장소의 korean-qa.toml 에 [publish] 를 두지 않고 여기에 적는다.
# 저장소에 두면 이 훅을 설치한 다른 사람의 push 까지 막는다.
#
# 쓰는 법 — 이 파일을 local-publish-repos.toml 로 복사해 고친 뒤 `python install.py`
#   (설치 폴더 ~/.claude/data/catalog/ 로 복사된다). 실제 목록은 gitignore 대상이다.

# 쓰는 순간의 검사를 공유·배포 문서만으로 좁힐 때(선택) — 공유 문서는 아래 발행 대상, [deploy] 를 둔 사이트 폴더,
# 머리말 `audience: share`(HTML 은 <meta name="audience" content="share">)인 문서. 그 밖은 쓸 때 검사하지 않는다.
# 노션, 아티팩트, 슬라이드로 내보내는 순간의 검사는 이 값과 무관하게 돈다. 빼면 예전처럼 전부 검사한다.
# check_scope = "shared"

# 2층 판정의 검사 단계(선택) — 비우면 max. 판정 명령의 --level 과 환경 변수 KOREAN_QA_LEVEL 이 이 값보다 앞선다.
#   max(최대)      첫 판정과 재판정 모두 Opus medium · 문서 한 건 한도 4,500원(API 키로 과금하면 2,500원)
#   balanced(가성비) 첫 판정 Opus low · 재판정 Sonnet medium · 지적을 모아서 재판정 · 한도 1,800원(API 키 1,000원)
#   min(최소)      첫 판정과 재판정 모두 Sonnet medium · 모아서 재판정 · 한도 900원(API 키 500원) · 일반 결함 회수가 낮음
#   한도는 API 단가로 환산한 판정 비용 — Claude Code 로그인(구독)으로 호출하면 같은 판정에 사용량을 더 써서 한도가 넉넉함
# 근거 측정은 runs/judge-effort-levels-20261104
# check_level = "balanced"

[[repo]]
origin = "github.com/<소유자>/<저장소>"     # 원격 origin 주소 · https 와 ssh 를 같게 본다
require = ["judgment", "lint"]   # lint — 이번 브랜치에서 새로 쓰거나 고친 줄의 1층 오류도 막음(빌드가 문체를 안 보는 저장소)
targets = ["*/docs/*.md", "*/pages/*.html", "README.md"]   # 뿌리 기준 · 칸 수까지 맞아야 함
base = "origin/main"                                       # 이 가지와 갈라진 뒤의 새 줄만 본다
