# 2층 운반 문서 — 사용자가 짚은 문장을 서로 다른 문서에서 모아 한 장에 이어 붙인 시험 자료다.
#
# 「~가 아니라」 반복은 한 문서 안의 건수와 밀도를 세는 갈래인데, 여기서는 F-023 과 F-075 처럼
# 다른 문서에서 온 문장이 한 장에 모여 세어진다. 문서의 성질이 아니라 이어 붙인 결과라서 끈다
# (2026-10-23). 줄 단위 갈래는 그대로 본다 — 운반 문서가 1층에 조용해야 2층 지적만 남는다.
#
# 「맞춤법」과 「맞춤법 의심」도 끈다(2026-11-02, 외래어 표기는 주의라 「맞춤법 의심」으로 나옴). F-171 은 사용자가 짚은 문장 원문(「6.0 릴리즈와 6.1 출시」)이라 글자를
# 바꿀 수 없는데, 그 문장이 짚힌 까닭은 표기가 아니라 같은 사건을 두 말로 부른 것이다(2층 몫).
# 1층 「맞춤법」이 「릴리즈」를 따로 잡는 것은 `tests/test_spelling_rule.py` 가 고정한다.
[rules]
off = ["「~가 아니라」 반복", "맞춤법", "맞춤법 의심"]
