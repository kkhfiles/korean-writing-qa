# 갈래 고르기 보기 — 쓰려면 `korean-qa.toml` 로 복사해 검사할 문서 위에 둔다.
#
# 검사기가 대상 파일에서 위로 올라가며 `korean-qa.toml` 을 찾는다. 저장소 뿌리에
# 하나 두면 그 아래 문서 전부에 걸린다.
#
#   python assets/doc-style-check.py --list-rules   # 적을 수 있는 이름 전부
#   python assets/doc-style-check.py <파일> --no-rules   # 설정을 무시하고 전부 봄
#
# ⛔ 끈 갈래는 검사 결과 맨 위와 합계 줄에 적힌다. 안 그러면 「오류 0」이 통과인지
#    안 본 것인지 갈리지 않는다.

[rules]

# 아예 안 볼 갈래. 낱개 이름과 묶음 이름(문장·낱말·번역투·구조·안내)을 섞어 적는다.
off = [
    # 표 머리 「비고」는 공문서 표의 표준 관례다. 그 관례를 쓰는 조직이면 끈다.
    "스캔 가치 없는 라벨",
]

# 오류에서 주의로 낮출 갈래. 발행을 막지는 않되 사람이 보게 남긴다.
warn = [
    # 「~로」·「~만」 종결은 정당한 값과 절단형이 섞인다. 판정을 사람에게 넘긴다.
    "절단형 의심",
]

# 주의에서 오류로 올릴 갈래. 그 조직이 특히 못 참는 것을 여기 적는다.
err = []


# ── 자주 쓰는 조합 ──────────────────────────────────────────────────────────
#
# 문장만 본다 — 개조식을 강제하지 않는 조직
#   off = ["구조", "안내"]
#
# 낱말만 본다 — 문체는 자유롭게 두고 지어낸 말만 잡는다
#   off = ["문장", "구조", "번역투", "안내"]
#
# 전부 보되 아무것도 발행을 막지 않는다 — 처음 들여올 때
#   warn = ["문장", "낱말", "번역투", "구조"]
